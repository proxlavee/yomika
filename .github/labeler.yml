'area: ci':
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

'area: docs':
  - changed-files:
      - any-glob-to-any-file:
          - CONTRIBUTING.md
          - README.md
          - docs/**

'area: ui':
  - changed-files:
      - any-glob-to-any-file:
          - ui/**

'area: tests':
  - changed-files:
      - any-glob-to-any-file:
          - crates/*/tests/**
          - tests/**
          - ui/tests/**
          - '**/*.test.ts'
          - '**/*.test.tsx'

'area: tauri':
  - changed-files:
      - any-glob-to-any-file:
          - crates/yomika/**

'area: app':
  - changed-files:
      - any-glob-to-any-file:
          - crates/yomika-app/**

'area: core':
  - changed-files:
      - any-glob-to-any-file:
          - crates/yomika-core/**
          - crates/yomika-runtime/**

'area: rpc':
  - changed-files:
      - any-glob-to-any-file:
          - crates/yomika-rpc/**
          - ui/lib/api/**
          - ui/openapi.json
          - ui/orval.config.ts

'area: llm':
  - changed-files:
      - any-glob-to-any-file:
          - crates/yomika-llm/**

'area: ml':
  - changed-files:
      - any-glob-to-any-file:
          - crates/yomika-ml/**
          - models/**

'area: renderer':
  - changed-files:
      - any-glob-to-any-file:
          - crates/yomika-psd/**
          - crates/yomika-renderer/**

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - '**/Cargo.toml'
          - Cargo.lock
          - '**/package.json'
          - bun.lock
          - docs/requirements.txt
