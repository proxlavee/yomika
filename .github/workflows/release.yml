name: Release

on:
  push:
    tags:
      - '*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Windows portable release
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2

      - name: Restore shared Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.0.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "crt", "thrust", "nvvm", "cublas", "cublas_dev", "cufft", "cufft_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev"]'
          log-file-suffix: 'windows-2022.txt'

      - name: Install MSVC Build Tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore Bun package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/ui/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('ui/**/*.js', 'ui/**/*.jsx', 'ui/**/*.ts', 'ui/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Validate release version
        shell: pwsh
        run: |
          $tagVersion = "$env:GITHUB_REF_NAME".TrimStart('v')
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $packageVersion = ($metadata.packages | Where-Object name -eq 'yomika' | Select-Object -First 1).version
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version '$tagVersion' does not match Yomika package version '$packageVersion'."
          }

      - name: Generate release notes
        shell: pwsh
        run: bun git-cliff --current --strip all --output "$env:RUNNER_TEMP/release-notes.md"

      - name: Build portable Windows executable
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: bun run build

      - name: Package portable artifacts
        id: package
        shell: pwsh
        run: |
          $source = 'target/release/yomika.exe'
          if (-not (Test-Path $source)) {
            throw "Expected executable was not produced at $source."
          }
          $artifactDir = 'target/release/artifacts'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $baseName = "Yomika-$env:GITHUB_REF_NAME-windows-x64"
          $portableExe = "$artifactDir/$baseName.exe"
          $portableZip = "$artifactDir/$baseName.zip"
          Copy-Item $source $portableExe
          Compress-Archive -Path $portableExe -DestinationPath $portableZip -Force
          "exe=$portableExe" >> $env:GITHUB_OUTPUT
          "zip=$portableZip" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = '${{ steps.package.outputs.exe }}'
          $zip = '${{ steps.package.outputs.zip }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $zip --clobber
          } else {
            gh release create $tag $exe $zip --verify-tag --title "Yomika $tag" --notes-file "$env:RUNNER_TEMP/release-notes.md"
          }

      - name: Preserve portable artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yomika-${{ github.ref_name }}-windows-portable
          path: target/release/artifacts/*
          if-no-files-found: ignore
          retention-days: 7
