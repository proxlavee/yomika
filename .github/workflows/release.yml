name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    strategy:
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-2022'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libclang-dev librsvg2-dev patchelf

      - name: Install CUDA Toolkit (ubuntu only)
        uses: Jimver/cuda-toolkit@v0.2.35
        if: startsWith(matrix.platform, 'ubuntu')
        with:
          cuda: '13.0.0'
          log-file-suffix: '${{ matrix.platform }}.txt'

      - name: Install CUDA Toolkit (windows only)
        uses: Jimver/cuda-toolkit@v0.2.35
        if: startsWith(matrix.platform, 'windows')
        with:
          cuda: '13.0.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "crt", "thrust", "nvvm", "cublas", "cublas_dev", "cufft", "cufft_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev"]'
          log-file-suffix: '${{ matrix.platform }}.txt'

      - name: Install MSVC Build Tools
        uses: ilammy/msvc-dev-cmd@v1
        if: startsWith(matrix.platform, 'windows')

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate release changelog
        id: release_notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'release_body<<EOF'
            bun git-cliff --current --strip all
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Configure repository-owned updater signing
        id: updater
        shell: bash
        env:
          YOMIKA_UPDATER_PUBKEY: ${{ vars.YOMIKA_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -n "$YOMIKA_UPDATER_PUBKEY" && -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            bun -e 'await Bun.write(`${process.env.RUNNER_TEMP}/yomika-updater.json`, JSON.stringify({ bundle: { createUpdaterArtifacts: "v1Compatible" }, plugins: { updater: { pubkey: process.env.YOMIKA_UPDATER_PUBKEY, endpoints: ["https://github.com/proxlavee/yomika/releases/latest/download/latest.json"] } } }))'
            echo "args=--config $RUNNER_TEMP/yomika-updater.json" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOMIKA_UPDATER_PUBKEY: ${{ vars.YOMIKA_UPDATER_PUBKEY }}
          NEXT_PUBLIC_YOMIKA_UPDATER_ENABLED: ${{ steps.updater.outputs.enabled }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          tauriScript: npx @tauri-apps/cli
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}
          includeUpdaterJson: ${{ steps.updater.outputs.enabled }}

  container:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            YOMIKA_REPOSITORY=${{ github.repository }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
