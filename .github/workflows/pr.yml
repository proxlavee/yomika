name: PR

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome First-Time Contributor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          issue_message: |
            Thanks for opening your first issue in Yomika.

            Please include:
            - what you expected to happen
            - what happened instead
            - steps to reproduce
            - screenshots or logs if available
            - your OS and GPU/runtime setup if the issue is build or inference related

          pr_message: |
            Thanks for your first PR to Yomika.

            Please review our contribution guide before review:
            https://github.com/proxlavee/yomika/blob/main/CONTRIBUTING.md

            In the PR description, include:
            - what changed
            - any user-visible behavior differences
            - how you verified the change

            If AI helped produce the patch, a human still needs to review and understand it before submission.
